id: https://modellen.netbeheernederland.nl/stelsel/registers/energie-uitwisselingsregister
name: energie-uitwisselingsregister
title: Energie-uitwisselingsregister
version: 1.4-draft
description: Het energie-uitwisselingsregister bevat de uitgewisselde energie zoals vastgesteld door een energieleverancier, meetverantwoordelijke partij of netbeheerder (systeembeheerder).
comments:
  - Dit register beschrijft de *vastgestelde* energie-uitwisseling. Het *toewijzen* en *toerekenen* ervan valt buiten de context van dit register.
  - |
    Voor de berekening en communicatie van verbruiksafhankelijke transportkosten voor grootverbruikers zijn relevant:
    
    - [Meterstand](#Meterstand) (onder aanname dat dit op de factuur vermeld moet worden)
    - [Uitgewisseld volume](#Uitgewisseld-volume) met een `resolutie`
    - [Restvolume](#Restvolume) (onder aanname dat ook dit een wegingsfactor kent)
    - [Piekbelasting](#Piekbelasting)

    Voor kleinverbruikers zijn daarnaast relevant:

    - [Standaardjaarvolume](#Standaardjaarvolume)
    - [Dynamische profielfractie elektriciteit](#Dynamische profielfractie elektriciteit)
    - [Standaard profielfractie elektriciteit](#Standaard profielfractie elektriciteit)
  - |
    Wijzigingen:
    
    1. `Dispuut` toegevoegd.
    2. `Jaarverbruik telemetrieverbruikers` toegevoegd.
    3. `profielcategorie` bij gas --> `aansluitingcategorie` (nieuwe regelgeving).
    4. `profielcategorie` bij elektriciteit --> `profielcategoriecode` (nieuwe regelgeving, vormt samen met `vastgesteld afnametype` de profielcategorie).
    5. `Allocatiepunt bij aansluiting` vervangen door `Allocatiepunt` (zodat naast aansluitingen ook netgebieden meedoen).
    6. `Tellerstand` --> `Meterstand` (voorkeursterm in regelgeving).
    7. `Meterstand` onderscheiden naar groot en klein, met een relatie naar het meetinrichtingenregister.
    8. `gereconcilieerd` verwijderd (hoort thuis in het reconciliatieproces).
    9. `kWmax` --> `Piekbelasting` (energiedrageragnostische terminologie)
    10. `resolutie` toegevoegd aan `Uitgewisseld volume` (ontbrak), daarom tevens `interval` op `Piekbelasting` gewijzigd naar `resolutie`.
    11. ISO 3610-tijdlijnen correct toegepast (geen `tijdlijn geldigheid` bij gebeurtenissen).
    12. `Uitgewisseld volume` relateert niet langer aan GCvO-installatie (publiceren we niet als zodanig).
    13. `eindmoment` is deel van de identificatie bij gebeurtenissen die elkaar in principe kunnen overlappen (`Uitgewisseld volume`, `Restvolume`, `Piekbelasting`, `Verwachte opwekking`, `Opgewekt volume`).
see_also:
  - iceg:g=2025-01-01
  - rge:#
prefixes:
  linkml: https://w3id.org/linkml/
  begrip: https://begrippen.netbeheernederland.nl/id/
  this: https://modellen.netbeheernederland.nl/stelsel/registers/energie-uitwisselingsregister#
  aansluitingenregister: https://modellen.netbeheernederland.nl/stelsel/registers/aansluitingenregister#
  installatieregister: https://modellen.netbeheernederland.nl/stelsel/registers/installatieregister#
  marktpartijenregister: https://modellen.netbeheernederland.nl/stelsel/registers/marktpartijenregister#
  meetinrichtingenregister: https://modellen.netbeheernederland.nl/stelsel/registers/meetinrichtingenregister#
  asg: https://wetten.overheid.nl/jci1.3:c:BWBR0052342&
  bce: https://wetten.overheid.nl/jci1.3:c:BWBR0037938&
  bcg: https://wetten.overheid.nl/jci1.3:c:BWBR0037923&
  bcg2026: https://wetten.overheid.nl/jci1.3:c:BWBR0052329&
  iceg: https://wetten.overheid.nl/jci1.3:c:BWBR0037934&
  mcg: https://wetten.overheid.nl/jci1.3:c:BWBR0037925&
  nce: https://wetten.overheid.nl/jci1.3:c:BWBR0037940&
  rge: https://www.internetconsultatie.nl/regeling_gegevensuitwisseling_energiewet/b1
default_prefix: this
imports:
  - ../../basiswaardesoorten
default_range: Tekst

classes:
  Actuele temperatuurcoëfficiënt:
    class_uri: Actuele-temperatuurcoefficient
    related_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: etmaalgemiddelde effectieve temperatuur, berekend op basis van de gemiddelde temperatuur en windsnelheid, die wordt gebruikt voor gasallocatieprocessen
    annotations:
      tijdlijn_registratie: true
    slots:
      - beginmoment
      - eindmoment
      - waarde
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
  Calorische omrekenfactor:
    class_uri: Calorische-omrekenfactor
    related_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: maandgemiddelde correctiefactor die de hoeveelheid verbruikt gas (in m3) omzet naar energie (m3(n;35;17)), op basis van de calorische waarde van het gas in een specifiek netgebied
    annotations:
      tijdlijn_registratie: true
    slots:
      - beginmoment
      - eindmoment
      - waarde
    attributes:
      # relaties:
      per:
        range: Netgebied
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - per
  Dispuut:
    class_uri: Dispuut
    related_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: formele betwisting van de juistheid van een vastgestelde meterstand
    comments:
      - De partij die de originele meterstand heeft vastgesteld heet de 'initiërende partij'. De partij die een dispuutmelding indient, heet de 'wederpartij'.
    annotations:
      tijdlijn_registratie: true
    slots:
      - herkomstindicatie
    attributes:
      alternatieve meterstand:
        description: door de wederpartij aangedragen vervangende meterstandwaarde
        range: Decimaal getal
        required: true
      referentie:
        description: kenmerk van het dispuut bij de wederpartij
        range: Code
      toelichting:
        description: onderbouwing van de betwisting door de wederpartij
      resultaat:
        description: formele uitkomst van de beoordeling door de initiërende partij
        range: Resultaat
      toelichting op resultaat:
        description: onderbouwing van het besluit door de initiërende partij
      # relaties:
      gestart door:
        range: Marktpartijsubregistratie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
      over:
        range: Meterstand
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "0..1"
    unique_keys:
      identificatie:
        unique_key_slots:
          - over
  Dynamische profielfractie elektriciteit:
    class_uri: Dynamische-profielfractie-elektriciteit
    is_a: Profielfractie
    description: per netgebied vastgestelde quotiënt van uitgewisselde elektriciteit in een onbalansverrekeningsperiode en uitgewisselde elektriciteit in het bijbehorende kalenderjaar
    slots:
      - beginmoment
      - eindmoment
      - energierichting
      - profielcategoriecode
      - vastgesteld afnametype
      - waarde
    attributes:
      bepalingsmethode:
        description: manier waarop de waarde van de profielfractie is bepaald
        range: Bepalingsmethode
        required: true
      # relaties:
      per:
        range: Netgebied
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - energierichting
          - per
          - profielcategoriecode
          - vastgesteld afnametype
  Gewogen gemiddelde calorische waarde:
    class_uri: Gewogen-gemiddelde-calorische-waarde
    related_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: per netgebied gewogen gemiddelde hoeveelheid energie die vrijkomt bij verbranding per eenheid van volume
    annotations:
      tijdlijn_registratie: true
    slots:
      - beginmoment
      - eindmoment
      - waarde
    attributes:
      # relaties:
      per:
        range: Netgebied
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - per
  Jaarverbruik telemetrieverbruikers:
    class_uri: Jaarverbruik-telemetrieverbruikers
    broad_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: werkelijk gemeten gasafname in m3(n;35,17) in de meest recente 12 volledige gasmaanden voor telemetrieverbruikers
    source: bcg2026:g=2026-02-21
    annotations:
      tijdlijn_geldigheid: true
      tijdlijn_registratie: true
    slots:
      - waarde
    attributes:
      # relaties:
      op:
        range: Allocatiepunt
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "0..1"
    unique_keys:
      identificatie:
        unique_key_slots:
          - op
  Meterstand:
    class_uri: Meterstand
    broad_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: stand van een specifiek telwerk op een bepaald moment
    slots:
      - eenheid
      - herkomstindicatie
      - waarde
    annotations:
      tijdlijn_registratie: true
    attributes:
      moment:
        description: tijdstip
        range: Tijdstip
        required: true
      # relaties:
      van:
        range: Telwerk
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
      vastgesteld door:
        range: Marktpartijsubregistratie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - moment
          - van
  Opgewekt volume:
    class_uri: Opgewekt-volume
    broad_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: door een GCvO-installatie ontstane energie
    annotations:
      tijdlijn_registratie: true
    slots:
      - beginmoment
      - eindmoment
      - netlevering
      - waarde
    attributes:
      # relaties:
      met:
        range: GCvO-installatie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
      vastgesteld door:
        range: Marktpartijsubregistratie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - eindmoment
          - met
          - netlevering
  Piekbelasting:
    class_uri: Piekbelasting
    broad_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: werkelijk voorgekomen maximale belasting van het net door een aangeslotene op een netaansluiting
    comments:
      - Bij elektriciteit bekend als kWmax.
    annotations:
      tijdlijn_registratie: true
    slots:
      - beginmoment
      - eindmoment
      - eenheid
      - energierichting
      - resolutie
      - waarde
    attributes:
      # relaties:
      op:
        range: Overdrachtspunt
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
      vastgesteld door:
        range: Marktpartijsubregistratie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - eindmoment
          - eenheid
          - energierichting
          - op
  Profielfractie:
    class_uri: Profielfractie
    related_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: relatief deel van uitgewisseld volume in een kalenderjaar
    annotations:
      tijdlijn_registratie: true
  Profielfractie gas:
    class_uri: Profielfractie-gas
    is_a: Profielfractie
    description: quotiënt van uitgewisseld gas in een uur en uitgewisseld gas in het bijbehorende kalenderjaar, niet gecorrigeerd voor temperatuur
    see_also:
      - iceg:bijlage=3&g=2025-01-01
    slots:
      - beginmoment
      - eindmoment
      - aansluitingcategorie
    attributes:
      regressiecoëfficiënt:
        description: fractie van een (jaar)verbruik dat het temperatuurafhankelijke verbruik per graad Celsius van het desbetreffende uur weergeeft
        comments:
          - In graden Celcius per uur, met 8 decimalen.
        range: Decimaal getal
        required: true
      stooktemperatuur:
        description: temperatuur waarboven geen temperatuurafhankelijk verbruik is
        comments:
          - In graden Celcius per uur, met 4 decimalen.
        range: Decimaal getal
        required: true
      temperatuuronafhankelijke deel:
        description: fractie van een (jaar)verbruik dat het temperatuuronafhankelijke verbruik van het desbetreffende uur weergeeft
        comments:
          - Getal met 8 decimalen.
        range: Decimaal getal
        required: true
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - aansluitingcategorie
  Restvolume:
    class_uri: Restvolume
    broad_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: verschil tussen een cumulatief gemeten volume en de som van de onderliggende deelvolumes over dezelfde periode
    comments:
      - Niet te verwarren met restantvolume.
    see_also:
      - mcg:hoofdstuk=5&paragraaf=5.2&artikel=5.2.3&g=2025-05-08
    annotations:
      tijdlijn_registratie: true
    slots:
      - beginmoment
      - eenheid
      - eindmoment
      - energierichting
      - waarde
    attributes:
      # relaties:
      op:
        range: Any
        exactly_one_of:
          - range: Allocatiepunt
          - range: Overdrachtspunt
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
      vastgesteld door:
        range: Marktpartijsubregistratie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - eindmoment
          - eenheid
          - energierichting
          - op
  Standaard profielfractie elektriciteit:
    class_uri: Standaard-profielfractie-elektriciteit
    is_a: Profielfractie
    description: verwachte energie-uitwisseling op een allocatiepunt bij gestandaardiseerde condities en op basis van een genormaliseerd jaar
    see_also:
      - iceg:bijlage=1&g=2025-01-01
    slots:
      - beginmoment
      - eindmoment
      - energierichting
      - profielcategoriecode
      - vastgesteld afnametype
      - waarde
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - energierichting
          - profielcategoriecode
          - vastgesteld afnametype
  Standaardjaarvolume:
    class_uri: Standaardjaarvolume
    exact_mappings:
      - begrip:y4yex #standaardjaarvolume
    comments:
      - Ook wel bekend als standaardjaarafname (SJA) elektriciteit, standaardjaarinvoeding (SJI) elektriciteit, standaardjaarverbruik (SJV) gas of jaarverbruik gas.
      - Niet te verwarren met jaarverbruik telemetrieverbruikers.
    see_also:
      - iceg:hoofdstuk=2&paragraaf=2.1&artikel=2.1.3&g=2025-01-01
    annotations:
      tijdlijn_geldigheid: true
      tijdlijn_registratie: true
    slots:
      - energierichting
      - tariefperiode
      - waarde
    attributes:
      # relaties:
      op:
        range: Allocatiepunt
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - energierichting
          - op
          - tariefperiode
  Temperatuur gecorrigeerde profielfractie gas:
    class_uri: Temperatuur-gecorrigeerde-profielfractie-gas
    is_a: Profielfractie
    description: quotiënt van uitgewisseld gas in een uur en uitgewisseld gas in het bijbehorende kalenderjaar, gecorrigeerd voor temperatuur
    see_also:
      - iceg:hoofdstuk=2&paragraaf=2.4&artikel=2.4.2&g=2025-01-01
    slots:
      - beginmoment
      - eindmoment
      - aansluitingcategorie
      - waarde
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - aansluitingcategorie
  Uitgewisseld volume:
    class_uri: Uitgewisseld-volume
    narrow_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: hoeveelheid of kwaliteit van energie, uitgewisseld met een energienet
    annotations:
      tijdlijn_registratie: true
    slots:
      - beginmoment
      - eindmoment
      - eenheid
      - energierichting
      - herkomstindicatie
      - tariefperiode
      - waarde
    attributes:
      reparatiemethodiek:
        description: wijze waarop de waarde is gecorrigeerd of berekend
        source: bce:g=2025-12-20
        range: Reparatiemethodiek
      validatiestatus:
        description: resultaat van de validatie van de waarde
        source: bce:g=2025-12-20
        range: Validatiestatus
      # relaties:
      op:
        range: Any
        exactly_one_of:
          - range: Allocatiepunt
          - range: Overdrachtspunt
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
      vastgesteld door:
        range: Marktpartijsubregistratie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - eenheid
          - energierichting
          - op
          - resolutie
          - tariefperiode
  Verwachte opwekking:
    class_uri: Verwachte-opwekking
    related_mappings:
      - begrip:tibcm #energie-uitwisseling
    description: verwachting van VertiCer omtrent opgewekte volumes
    annotations:
      tijdlijn_registratie: true
    slots:
      - beginmoment
      - eindmoment
    attributes:
      netlevering:
        description: geeft weer of invoeding in het energienet wordt verwacht
        range: boolean
        required: true
      niet-netlevering:
        description: geeft weer of opwekking wordt verwacht, ongeacht eventuele invoeding in het energienet
        range: boolean
        required: true
      # relaties:
      met:
        range: GCvO-installatie
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie:
        unique_key_slots:
          - beginmoment
          - eindmoment
          - met
  # externe entiteiten:
  Allocatiepunt:
    class_uri: aansluitingenregister:Allocatiepunt
    annotations:
      external_registry: Aansluitingenregister
  Any:
    class_uri: linkml:Any
  GCvO-installatie:
    class_uri: installatieregister:GCvO-installatie
    annotations:
      external_registry: Installatieregister
  Marktpartijsubregistratie:
    class_uri: marktpartijenregister:Marktpartijsubregistratie
    annotations:
      external_registry: Marktpartijenregister
  Meetinrichtingenregister:
    class_uri: meetinrichtingenregister:Telwerk
    annotations:
      external_registry: Meetinrichtingenregister
  Netgebied:
    class_uri: aansluitingenregister:Netgebied
    annotations:
      external_registry: Aansluitingenregister
  Overdrachtspunt:
    class_uri: aansluitingenregister:Overdrachtspunt
    annotations:
      external_registry: Aansluitingenregister

slots:
  aansluitingcategorie:
    description: classificering van allocatiepunten bij gasaansluitingen op grond van objectief vast te stellen kenmerken, zoals in de Allocatiecode systeembeheerders gas nader vastgesteld
    source: bcg2026:g=2026-02-21
    comments:
      - Voorheen `profielcategorie`.
    range: Aansluitingcategorie
    required: true
  beginmoment:
    description: eerste tijdstip waarop iets geldt
    range: Tijdstip
    required: true
  eenheid:
    description: maat waarin natuurkundige grootheden numeriek kunnen worden uitgedrukt
    range: Eenheid
    required: true
  eindmoment:
    description: eerste tijdstip waarop iets niet meer geldt
    range: Tijdstip
    required: true
  energierichting:
    exact_mappings:
      - begrip:yn3hb #energierichting
    range: Energierichting
    required: true
  herkomstindicatie:
    description: oorsprong van een waarde
    source: bce:g=2025-12-20
    range: Herkomstindicatie
    required: true
  netlevering:
    description: geeft aan of het volume is ingevoed op het energienet
    range: boolean
    required: true
  profielcategoriecode:
    description: classificering van allocatiepunten bij elektriciteitsaansluitingen op grond van objectief vast te stellen kenmerken, exclusief het vastgesteld afnametype
    comments:
      - Voorheen bekend als `profielcategorie`.
      - De combinatie van `profielcategoriecode` en `vastgesteld afnametype` identificeert een profielcategorie.
    range: Profielcategoriecode
    required: true
  vastgesteld afnametype:
    description: bepaling of op een allocatiepunt sprake is van afname met invoeding of afname zonder invoeding
    comments:
      - Ook bekend als `vastgesteld afnametype`.
    range: Vastgesteld afnametype
    required: true
  resolutie:
    description: voorgenomen tijdsduur tussen beginmoment en eindmoment
    range: Resolutie
  tariefperiode:
    description: aaneengesloten periode van normaaluren of laaguren
    comments:
      - Van toepassing op elektriciteit bij tijdsperioden langer dan een dag.
    range: Tariefperiode
  waarde:
    description: hoeveelheid eenheden
    range: Reëel getal
    required: true

enums:
  Bepalingsmethode:
    permissible_values:
      DYN:
        description: dynamisch berekend
      FBR:
        description: fallback regime
  Eenheid:
    permissible_values:
      kvar:
      kvarh:
      kW:
      kWh:
      m3:
      m3(n):
      m3(n;35;17):
      MJ/m3(n):
  Energierichting:
    permissible_values:
      afname:
        meaning: begrip:3j33z #afname
      invoeding:
        meaning: begrip:j8cpp #invoeding
  Herkomstindicatie:
    permissible_values:
      berekend:
      fysieke opname:
      gemeten door MV:
      "gemeten door MV: update":
      klantstand:
      overeengekomen:
      P4-stand:
  Profielcategoriecode:
    permissible_values:
      E1A:
      E1B:
      E1C:
      E2A:
      E2B:
      E4A:
  Vastgesteld afnametype:
    permissible_values:
      AMI:
        description: afname met invoeding
      AZI:
        description: afname zonder invoeding
      n.v.t.:
        description: niet van toepassing
