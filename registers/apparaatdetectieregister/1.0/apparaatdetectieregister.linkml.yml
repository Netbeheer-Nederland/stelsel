#     permissible_values:
#       PV:
#         description: PhotoVoltaic panel (zonnepaneel)
#       BESS:
#         description: Battery Energy Storage System (thuisbatterij)
#       HP:
#         description: Heat Pump (warmtepomp)
#       EV:
#         description: Electric Vehicle (laadpaal)
#       EH:
#         description: Electronic Heating (Airco, Hybride Heat Pump or Full Electric Heat Pump)
