id: https://modellen.netbeheernederland.nl/stelsel/registers/apparaatdetectieregister
name: apparaatdetectieregister
title: Apparaatdetectieregister
version: 1.0-draft
description: Het apparaatdetectieregister bevat gegevens over apparaten die, op basis van een profielmeting, vermoed worden op een overdrachtspunt van een aansluiting. Deze gegevens zijn schattingen met een bepaalde betrouwbaarheid. Zo'n vermoeden op basis van een profielmeting wordt een detectie genoemd. En het vermoeden van een apparaat wordt een apparaatdetectie genoemd.
comments:
  - "⚠️ Dit register is in opbouw. De definities en eenheden worden nog geverifieerd."
prefixes:
  linkml: https://w3id.org/linkml/
  begrip: https://begrippen.netbeheernederland.nl/id/
  this: https://modellen.netbeheernederland.nl/stelsel/registers/apparaatdetectieregister#
  aansluitingenregister: https://modellen.netbeheernederland.nl/stelsel/registers/aansluitingenregister#
  iceg: https://wetten.overheid.nl/jci1.3:c:BWBR0037934&
default_prefix: this
imports:
  - ../../basiswaardesoorten
default_range: Tekst

classes: 
  Apparaatdetectie:
    class_uri: Apparaatdetectie
    related_mappings:
      - begrip:installatie
    description: vaststelling dat een of meer apparaten van een bepaalde soort waarschijnlijk aanwezig zijn achter het overdrachtspunt van een aansluiting gedurende een bepaalde periode
    attributes: 
      beginmoment:
        description: eerste tijdstip waarop iets geldt
        range: Tijdstip
        required: true
      eindmoment:
        description: eerste tijdstip waarop iets niet meer geldt
        range: Tijdstip
        required: true
      apparaatsoort:
        description: functionele categorie waartoe de gedetecteerde apparaten behoren
        range: Code
        required: true
      betrouwbaarheid:
        description: mate van zekerheid dat de apparaatdetectie correct is ⚠️ (%) ⚠️
        range: Reëel getal
        comments: 
          - "Uitgedrukt als een waarde tussen 0 en 1."
        required: true
      geschat vermogen:
        description: vermoedelijke maximale vermogen van de gedetecteerde apparaten gezamenlijk ⚠️ kW ⚠️
        range: Reëel getal
        comments:
          - "Validatie: de waarde mag niet kleiner zijn dan 0."
        unit:
          ucum_code: kW
        required: true
      geschatte opslagcapaciteit:
        description: vermoedelijke maximale hoeveelheid energie die de gedetecteerde apparaten gezamenlijk kunnen opslaan in ⚠️ kWh ⚠️
        range: Reëel getal
        comments:
          - "Validatie: de waarde mag niet kleiner zijn dan 0."
        unit:
          ucum_code: kWh
        required: false
      # relaties:
      op:
        range: Overdrachtspunt
        required: true
        multivalued: false
        annotations:
          inverse_cardinality: "*"
    unique_keys:
      identificatie: # de sleutel heet altijd identificatie
        unique_key_slots:
          - beginmoment
          - eindmoment
          - apparaatsoort

  # externe entiteiten:
  Overdrachtspunt:
    class_uri: aansluitingenregister:Overdrachtspunt
    annotations:
      external_registry: Aansluitingenregister

